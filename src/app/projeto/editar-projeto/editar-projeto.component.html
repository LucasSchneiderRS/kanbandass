
<div>
    <mat-form-field class= "codigo" appearance = "fill" >
        <mat-label for="codigo">Codigo Projeto:</mat-label>
        <input matInput [formControl]="codigo">
    </mat-form-field>
</div>

<div>
    <mat-form-field class= "nomeProjeto" appearance = "fill" >
        <mat-label for="nomeProjeto">Nome Projeto:</mat-label>
        <input matInput [formControl]="nomeProjeto">
    </mat-form-field>
</div>

<div>
    <img [src]="getJpgNomeProjeto()" class="preview">
</div>

<H1> Status: </H1>
<mat-selection-list  [multiple]="false" class="status" [(ngModel)]="statusSelecionado">
    <mat-list-option *ngFor="let status of listaStatus" [value]="status">
      {{status}}
    </mat-list-option>
</mat-selection-list>


<div>
    <mat-form-field class= "descricao" appearance = "fill">
        <mat-label for="descricao">Descricao:</mat-label>
        <textarea matInput [formControl]="descricao"></textarea>
    </mat-form-field>
</div>

<div>
    <mat-form-field class= "objetivo" appearance = "fill">
        <mat-label for="descricao">Objetivo:</mat-label>
        <input matInput [formControl]="objetivo">
    </mat-form-field>
</div>

<div id="select">
    <mat-form-field class= "prioridade" appearance = "fill">
        <mat-label for="prioridade">Prioridade:</mat-label>
        <mat-select [formControl]="prioridade">
          <mat-option value="Baixa">Baixa</mat-option>
          <mat-option value="Media">Media</mat-option>
          <mat-option value="Alta">Alta</mat-option>
        </mat-select>
    </mat-form-field>
  </div>

<div id="select">
    <mat-form-field class= "responsavel" appearance = "fill">
        <mat-label for="responsavel">Responsavel:</mat-label>
        <mat-select [formControl]="responsavel">
            <mat-option *ngFor="let pessoa of listaEquipe" value={{pessoa}}>{{pessoa}}</mat-option>
        </mat-select>
    </mat-form-field>
</div>

<H1> Equipe: </H1>
<mat-selection-list  class="equipe" [(ngModel)]="equipeSelecionada">
    <mat-list-option *ngFor="let equipe of listaEquipe" [value]="equipe">
      {{equipe}}
    </mat-list-option>
  </mat-selection-list>

  <H1> Data Entrega: </H1>
<div>
    <mat-form-field appearance="fill">
      <mat-label>Selecione Data:</mat-label>
      <input matInput [matDatepicker]="picker"  [formControl]="dataEntrega">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
</div>

<button class="button" mat-raised-button (click)="gravaProjeto()" color="primary">Gravar Projeto</button>
